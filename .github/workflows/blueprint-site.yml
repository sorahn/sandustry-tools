name: Deploy blueprint site

on:
  push:
    branches: [main]
    paths:
      - "apps/blueprint-site/**"
      - "!apps/blueprint-site/**/*.md"
      - "!apps/blueprint-site/**/__tests__/**"
      - "packages/sandustry-ui/**"
      - "!packages/sandustry-ui/**/*.md"
      - "packages/sandustry-blueprint-core/**"
      - "!packages/sandustry-blueprint-core/**/*.md"
      - "!packages/sandustry-blueprint-core/tests/**"
      - "packages/sandustry-save-core/**"
      - "!packages/sandustry-save-core/**/*.md"
      - "!packages/sandustry-save-core/tests/**"
      - ".github/workflows/blueprint-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed=$(git diff-tree --root --no-commit-id --name-only -r "$CURRENT_SHA")
          else
            changed=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")
          fi

          deploy=false
          while IFS= read -r file; do
            case "$file" in
              apps/blueprint-site/*)
                [[ "$file" == *.md || "$file" == */__tests__/* ]] || deploy=true
                ;;
              packages/sandustry-ui/*)
                [[ "$file" == *.md ]] || deploy=true
                ;;
              packages/sandustry-blueprint-core/*)
                [[ "$file" == *.md || "$file" == */tests/* ]] || deploy=true
                ;;
              packages/sandustry-save-core/*)
                [[ "$file" == *.md || "$file" == */tests/* ]] || deploy=true
                ;;
              .github/workflows/blueprint-site.yml)
                deploy=true
                ;;
            esac
          done <<< "$changed"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        # npm ci rejects this macOS-generated lockfile because optional native
        # packages are platform-specific. npm install resolves the Linux
        # packages required by the Pages runner while honoring the lockfile.
        run: npm install --no-audit --no-fund
      - name: Build blueprint core
        run: npm run build --workspace @daryl.roberts/sandustry-blueprint-core
      - name: Build blueprint site
        env:
          VITE_BLUEPRINT_PARENT_ORIGINS: ${{ vars.BLUEPRINT_PARENT_ORIGINS }}
        run: npm run build --workspace @sandustry/blueprint-site
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/blueprint-site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
